# ahmedmarketer.com — proxy inverse vers l'application Next.js
# Certificats Let's Encrypt obtenus via deploy/ssl-init.sh puis renouvelés
# automatiquement par le service certbot.

upstream whitelabel_app {
  server app:3000;
  keepalive 32;
}

# ---------- HTTP : défi ACME + redirection vers HTTPS ----------
server {
  listen 80;
  listen [::]:80;
  server_name ahmedmarketer.com www.ahmedmarketer.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://ahmedmarketer.com$request_uri;
  }
}

# ---------- HTTPS : www → apex ----------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.ahmedmarketer.com;

  ssl_certificate /etc/letsencrypt/live/ahmedmarketer.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ahmedmarketer.com/privkey.pem;

  return 301 https://ahmedmarketer.com$request_uri;
}

# ---------- HTTPS : site ----------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ahmedmarketer.com;

  ssl_certificate /etc/letsencrypt/live/ahmedmarketer.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ahmedmarketer.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # téléversements de médias (vidéos jusqu'à 300 Mo côté application)
  client_max_body_size 350m;

  # compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # en-têtes de sécurité
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # médias servis depuis Postgres : streaming direct (Range), sans tampon disque
  # NB : pas de slash final — sinon nginx redirige /api/media -> /api/media/ (301)
  # et Next.js le renvoie en 308 vers /api/media, créant une boucle de redirection.
  location /api/media {
    proxy_pass http://whitelabel_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    proxy_pass http://whitelabel_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 90s;
  }
}
